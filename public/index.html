<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f7f8" />
    <title>在路上</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1.5 7.5 L14 2.5 L9 14 L7.5 8.5 Z' fill='%23243e68'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <p id="toast" class="toast" role="status" hidden></p>

      <section id="view-home" class="view has-dock">
        <div class="scroll">
          <header class="topbar">
            <h1>在路上</h1>
          </header>
          <div class="activity">
            <p id="travel-count"></p>
            <div id="home-map"></div>
          </div>
          <div id="home-letters"></div>
          <section class="block">
            <h2>固定路線</h2>
            <div id="preset-list"></div>
          </section>
        </div>
        <div class="dock">
          <button type="button" class="btn primary" id="btn-draw">抽一位隨機收件人</button>
        </div>
      </section>

      <section id="view-compose" class="view has-dock" hidden>
        <div class="scroll">
        <header class="topbar">
          <button type="button" class="icon-btn" id="compose-back" aria-label="返回">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M14.5 5 L8 12 L14.5 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <h1>寫信</h1>
        </header>
        <div class="compose-body">
          <div id="recipient-banner" class="recipient-card" hidden>
            <p class="who" id="recipient-name"></p>
            <p class="where" id="recipient-where"></p>
            <button type="button" class="text-btn" id="btn-change-recipient">換一位</button>
          </div>
          <fieldset class="panel" id="sender-panel" hidden>
            <legend>寄出地</legend>
            <div id="sender-chips" class="chip-scroller"></div>
          </fieldset>
          <div class="paper-frame">
            <canvas id="letter-canvas" width="600" height="760"></canvas>
          </div>
          <div class="tool-row">
            <button type="button" id="btn-upload">上傳照片</button>
            <button type="button" id="btn-undo">復原</button>
            <button type="button" id="btn-clear">清除</button>
            <input id="file-input" type="file" accept="image/*" hidden />
          </div>
          <fieldset class="panel" id="from-panel">
            <legend>寄出地</legend>
            <div id="from-chips" class="chips"></div>
          </fieldset>
          <fieldset class="panel" id="to-panel">
            <legend>收件地</legend>
            <div id="to-chips" class="chips"></div>
          </fieldset>
          <div class="estimate" id="estimate"></div>
          <div class="pace-row">
            <span>節奏</span>
            <div class="segment" role="group" aria-label="飛行節奏">
              <button type="button" id="pace-fast" data-pace="playable-fast" aria-pressed="true">可玩快</button>
              <button type="button" id="pace-slow" data-pace="romantic-slow" aria-pressed="false">浪漫慢</button>
            </div>
          </div>
          <p class="hint" id="pace-hint" hidden>預留節奏。同樣的距離會飛得慢很多。</p>
        </div>
        </div>
        <div class="dock dock-split">
          <button type="button" class="btn" id="btn-save">儲存草稿</button>
          <button type="button" class="btn primary" id="btn-throw">扔出</button>
        </div>
      </section>

      <section id="view-draw" class="view view-flight view-draw" hidden>
        <div id="draw-map"></div>
        <button type="button" class="icon-btn float-back" id="draw-back" aria-label="返回">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M14.5 5 L8 12 L14.5 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="sheet">
          <p class="route" id="draw-kicker">抽到一位收件人</p>
          <p class="eta" id="draw-name"></p>
          <p class="remain" id="draw-where"></p>
          <p class="draw-meta" id="draw-meta"></p>
          <p class="via" id="draw-via"></p>
          <div class="leg-legend" id="draw-legend"></div>
          <div class="sender-line">
            <span>寄出地</span>
            <div id="draw-senders" class="chip-scroller"></div>
          </div>
          <div class="sheet-actions">
            <button type="button" class="btn" id="btn-redraw">換一位</button>
            <button type="button" class="btn primary" id="btn-write">寫給這位</button>
          </div>
        </div>
      </section>

      <section id="view-flight" class="view view-flight" hidden>
        <div id="map"></div>
        <button type="button" class="icon-btn float-back" id="flight-back" aria-label="返回">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M14.5 5 L8 12 L14.5 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div id="transfer-banner" class="transfer-banner" role="status" aria-live="polite" hidden>
          <div class="transfer-card">
            <p id="transfer-kicker" class="transfer-kicker"></p>
            <p id="transfer-title" class="transfer-title"></p>
            <span id="transfer-mark" class="transfer-mark"></span>
          </div>
        </div>
        <div class="sheet" id="flight-sheet">
          <p class="travel-count" id="flight-travel"></p>
          <p class="route" id="flight-route"></p>
          <p class="mode-now" id="flight-mode"></p>
          <p class="eta" id="flight-eta"></p>
          <p class="remain" id="flight-remain"></p>
          <div class="leg-legend" id="flight-legend"></div>
          <div class="track" id="flight-track" aria-hidden="true"><span id="flight-bar"></span></div>
          <button type="button" class="btn primary" id="btn-open" hidden>拆信</button>
        </div>
      </section>

      <section id="view-read" class="view view-read" hidden>
        <header class="topbar topbar-plain">
          <button type="button" class="icon-btn" id="read-back" aria-label="返回">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M14.5 5 L8 12 L14.5 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <h1>來信</h1>
        </header>
        <div class="read-body">
          <div id="ceremony" class="ceremony">
            <div class="ceremony-stack">
              <figure class="letter-card ceremony-letter">
                <img id="read-image" alt="" />
              </figure>
              <div class="envelope" aria-hidden="true">
                <div class="envelope-body"></div>
                <div class="envelope-flap"></div>
                <div class="seal"></div>
                <div class="postmark">
                  <span>在路上</span>
                  <b id="postmark-place"></b>
                  <small id="postmark-time"></small>
                </div>
              </div>
              <button type="button" id="ceremony-skip" class="ceremony-hit" aria-label="拆開這封信"></button>
            </div>
            <p class="caption" id="read-caption"></p>
            <div class="aftertaste" id="read-after"></div>
          </div>
        </div>
      </section>
      <div id="throw-stage" class="throw-stage" hidden>
        <p class="throw-stamp"><span>在路上</span>扔出去了</p>
        <div class="throw-letter-slot">
          <div class="throw-letter-wrap">
            <img id="throw-letter" alt="" />
            <span class="throw-crease" aria-hidden="true"></span>
          </div>
        </div>
        <div class="throw-plane" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="96" height="96">
            <path d="M31 9 L53 49 L32 40 L11 51 Z" fill="#f3eadc" stroke="#3c342c" stroke-width="1.35" stroke-linejoin="round"/>
            <path d="M31 16 L32 40" stroke="#3c342c" stroke-width="0.8" opacity="0.45"/>
            <path d="M20 36 L45 33" stroke="#8a5a38" stroke-width="0.7" opacity="0.55"/>
          </svg>
        </div>
      </div>
    </div>
    <script src="/vendor/leaflet/leaflet.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
